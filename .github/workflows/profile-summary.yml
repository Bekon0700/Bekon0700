name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day, midnight UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the summary cards (github-action)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Built-in token is enough for public stats. To include private-repo
          # activity, create a PAT, add it as the SUMMARY_GITHUB_TOKEN secret,
          # and swap the line below to ${{ secrets.SUMMARY_GITHUB_TOKEN }}.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Bekon0700
          BRANCH_NAME: "profile-summary"
          UTC_OFFSET: 6 # Bangladesh (UTC+6) — drives the "productive time" card
          THEME: "tokyonight"
          AUTO_PUSH: true
